name: Terraform Plan

# WHEN DOES THIS RUN?
# Answer: Every time someone opens a PR or pushes to a branch with an open PR
# ONLY if files in environments/prod/ or modules/ changed
on:
  pull_request:
    paths:
      - 'environments/prod/**'
      - 'modules/**'
      - '.github/workflows/plan.yml'

# Environment variables used in all steps
env:
  TF_VERSION: 1.5.0
  AWS_REGION: us-east-1

jobs:
  # This job has ONE name: "plan"
  # It contains multiple steps
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # These are the GitHub Actions permissions this job needs
    permissions:
      id-token: write      # Needed for OIDC authentication
      contents: read       # Needed to read code from the repo
      pull-requests: write # Needed to write comments on the PR

    steps:
      # STEP 1: Download your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Login to AWS using OIDC (no hardcoded credentials!)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The role ARN tells AWS which role to use
          # AWS_ACCOUNT_ID comes from GitHub Secrets
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      # STEP 3: Install Terraform binary
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # STEP 4: Check if code is properly formatted
      # continue-on-error: true means "if this fails, keep going"
      # We use this because formatting is nice-to-have, not critical
      - name: Terraform Format Check
        id: fmt
        working-directory: environments/prod
        run: terraform fmt -check -recursive
        continue-on-error: true

      # STEP 5: Download terraform modules and setup S3 backend
      - name: Terraform Init
        id: init
        working-directory: environments/prod
        run: terraform init

      # STEP 6: Validate terraform syntax
      - name: Terraform Validate
        id: validate
        working-directory: environments/prod
        run: terraform validate

      # STEP 7: Create a preview of what will change
      # -lock=false: Don't try to lock state (we don't need it for plan)
      # -var-file=example.tfvars: Use the variables file
      # -out=tfplan: Save the plan to a file (so we can show it)
      # terraform show > plan.txt: Convert the plan to text format
      # continue-on-error: true means "if plan fails, still try to comment"
      # BUT we catch the error later with "Fail if plan failed" step
      - name: Terraform Plan
        id: plan
        working-directory: environments/prod
        run: |
          terraform plan -no-color -lock=false -var-file=example.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Convert Plan to Text
        working-directory: environments/prod
        run: |
          terraform show -no-color tfplan > plan.txt

      # STEP 8: Post the plan as a comment on the PR
      # This helps reviewers see what will change without going to the console
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/prod/plan.txt', 'utf8');

            const maxChars = 30000;
            const planOutput = plan.length > maxChars
              ? plan.substring(0, maxChars) + '\n... (truncated)'
              : plan;

            const comment = `## 📋 Terraform Plan

            **Status:** ${{ steps.plan.outcome }}

            <details>
            <summary>Click to expand plan output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`
            </details>

            ---

            ✅ **Next Steps:**
            1. Review the plan above
            2. Approve the PR
            3. Merge to \`main\` to trigger \`terraform apply\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1







