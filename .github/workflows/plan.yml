name: Terraform Plan

on:
  pull_request:
    paths:
      - 'environments/prod/**'
      - 'modules/**'
      - '.github/workflows/plan.yml'

env:
  TF_VERSION: 1.5.0
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.617163942982 }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        id: fmt
        working-directory: environments/prod
        run: terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        working-directory: environments/prod
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        working-directory: environments/prod
        run: terraform validate
      
      - name: Terraform Plan
        id: plan
        working-directory: environments/prod
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true
      
      - name: Create Plan Summary
        if: always()
        id: summary
        working-directory: environments/prod
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Format Check" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.fmt.outcome }}" == "success" ]; then
            echo "✅ Code is properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Code formatting issues detected. Run: terraform fmt -recursive" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate.outcome }}" == "success" ]; then
            echo "✅ Configuration is valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Configuration validation failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Plan Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.plan.outcome }}" == "success" ]; then
            echo "✅ Plan generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Plan failed" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/prod/plan.txt', 'utf8');
            const maxChars = 30000;
            const planOutput = plan.length > maxChars 
              ? plan.substring(0, maxChars) + '\n... (truncated)' 
              : plan;
            
            const comment = `## 📋 Terraform Plan
            
            **Status:** ${{ steps.plan.outcome }}
            
            <details>
            <summary>Click to expand plan output</summary>
            
            \`\`\`hcl
            ${planOutput}
            \`\`\`
            </details>
            
            ---
            
            ✅ **Next Steps:**
            1. Review the plan above
            2. Approve the PR
            3. Merge to \`main\` to trigger \`terraform apply\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
