auth_enabled: false

# Ingester configuration - FIXED: Removed invalid fields (chunk_size_target, enforce_metric_name, num_tokens, heartbeat_timeout)
ingester:
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  max_chunk_age: 2h
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

# Limits configuration - FIXED: Removed enforce_metric_name (invalid in 2.9.4)
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 10000

schema_config:
  configs:
    - from: 2020-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

server:
  http_listen_port: 3100
  log_level: info
  grpc_listen_port: 9096

# Storage configuration - FIXED: Added cache_location (required by boltdb-shipper in 2.9.4)
storage_config:
  boltdb_shipper:
    active_index_directory: /var/lib/loki/boltdb-shipper-active
    shared_store: filesystem
    cache_location: /var/lib/loki/boltdb-shipper-cache
  filesystem:
    directory: /var/lib/loki/chunks

chunk_store_config:
  max_look_back_period: 0s

# NEW: Compactor configuration - CRITICAL: Was missing, caused "mkdir: no such file or directory" error
compactor:
  working_directory: /var/lib/loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 5m
  retention_delete_worker_count: 10

# Table manager - FIXED: Changed to enable retention (was disabled before)
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h